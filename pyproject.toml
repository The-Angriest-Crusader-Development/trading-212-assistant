[build-system]
requires = ["setuptools >= 80.10.2", "setuptools-scm[simple] >= 9.2.2"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "trading-212-assistant"
requires-python = ">= 3.14.2"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"